spring:
  datasource:
    # 所有本地参数都可以通过 CT_* 环境变量覆盖，默认值对应当前 Docker 环境。
    url: jdbc:mysql://${CT_DB_HOST:localhost}:${CT_DB_PORT:3306}/${CT_DB_NAME:campus_trade}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${CT_DB_USERNAME:root}
    password: ${CT_DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CampusTradeHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000

campus:
  file:
    # 第一版本地上传目录；生产环境可通过环境变量改为挂载卷目录，或替换为 OSS 实现。
    upload-dir: ${CT_UPLOAD_DIR:uploads}
  redis:
    # Redis 当前运行在本机 Docker；部署后可用环境变量改成容器服务名。
    host: ${CT_REDIS_HOST:localhost}
    port: ${CT_REDIS_PORT:6379}
    database: ${CT_REDIS_DATABASE:0}
    password: ${CT_REDIS_PASSWORD:}
    connect-timeout: 3s
  jwt:
    # issuer 会写入 JWT 的 iss，并在解析时强制核对。
    issuer: campus-trade
    # 该默认值仅用于本地开发；生产环境必须通过 CT_JWT_SECRET 设置独立随机密钥。
    secret: ${CT_JWT_SECRET:campus-trade-local-jwt-secret-change-me-2026}
    # JWT 与 Redis 登录态使用相同有效期，默认 7 天。
    ttl: ${CT_JWT_TTL:7d}
  order:
    # 定时任务每分钟扫描一次超时待确认订单；可用环境变量临时关闭。
    timeout-scan-enabled: ${CT_ORDER_TIMEOUT_SCAN_ENABLED:true}
    timeout-scan-delay-ms: ${CT_ORDER_TIMEOUT_SCAN_DELAY_MS:60000}

logging:
  level:
    com.campus.trade: debug
    # 开发期输出 MyBatis 执行信息；生产配置应调整为 info。
    com.campus.trade.category.mapper: debug
