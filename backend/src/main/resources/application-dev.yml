spring:
  datasource:
    # 所有本地参数均可通过 CT_* 环境变量覆盖；默认值对应当前 Docker 环境。
    url: jdbc:mysql://${CT_DB_HOST:localhost}:${CT_DB_PORT:3306}/${CT_DB_NAME:campus_trade}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${CT_DB_USERNAME:root}
    password: ${CT_DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CampusTradeHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000
  data:
    redis:
      # Spring Boot 自动据此创建 StringRedisTemplate；业务代码直接使用 Redis 的字符串命令。
      host: ${CT_REDIS_HOST:localhost}
      port: ${CT_REDIS_PORT:6379}
      database: ${CT_REDIS_DATABASE:0}
      password: ${CT_REDIS_PASSWORD:}
      connect-timeout: 3s

campus:
  file:
    # 第一版本地上传目录；生产环境可用环境变量改为挂载卷目录，或替换为 OSS 实现。
    upload-dir: ${CT_UPLOAD_DIR:uploads}
  jwt:
    # issuer 会写入 JWT 的 iss，并在解析时强制核对。
    issuer: campus-trade
    # 该默认值仅用于本地开发；生产环境必须通过 CT_JWT_SECRET 设置独立随机密钥。
    secret: ${CT_JWT_SECRET:campus-trade-local-jwt-secret-change-me-2026}
    # JWT 最长有效期为 7 天；Redis 登录态另设一天滑动过期。
    ttl: ${CT_JWT_TTL:7d}
  order:
    # 定时任务始终作为超时关单补偿；即使 MQ 发送失败或积压，也会最终处理到期订单。
    timeout-scan-enabled: ${CT_ORDER_TIMEOUT_SCAN_ENABLED:true}
    timeout-scan-delay-ms: ${CT_ORDER_TIMEOUT_SCAN_DELAY_MS:60000}
    timeout-message:
      # 默认关闭，避免未部署 RocketMQ 时影响现有功能；准备好 Proxy 和 DELAY Topic 后再开启。
      enabled: ${CT_ORDER_TIMEOUT_MESSAGE_ENABLED:false}
      # RocketMQ 5 gRPC 客户端连接 Proxy，不是连接 NameServer 的 9876 端口。
      endpoints: ${CT_ROCKETMQ_ENDPOINTS:localhost:8081}
      topic: ${CT_ROCKETMQ_ORDER_TIMEOUT_TOPIC:campus_trade_order_timeout}
      tag: ${CT_ROCKETMQ_ORDER_TIMEOUT_TAG:CONFIRM_TIMEOUT}
      consumer-group: ${CT_ROCKETMQ_ORDER_TIMEOUT_CONSUMER_GROUP:campus_trade_order_timeout_consumer}
      # 本地 Docker Proxy 默认不启用 TLS；云服务环境按实际配置开启。
      ssl-enabled: ${CT_ROCKETMQ_SSL_ENABLED:false}
      request-timeout: ${CT_ROCKETMQ_REQUEST_TIMEOUT:3s}
      producer-max-attempts: ${CT_ROCKETMQ_PRODUCER_MAX_ATTEMPTS:3}

logging:
  level:
    com.campus.trade: debug
    # 开发期输出 MyBatis 执行信息；生产配置应调整为 info。
    com.campus.trade.category.mapper: debug
