spring:
  application:
    # 应用名称会出现在日志中，后续接入监控时也用于识别服务。
    name: campus-trade
  profiles:
    # 本地默认使用 dev；部署时通过 CT_PROFILE=prod 覆盖。
    active: ${CT_PROFILE:dev}
  jackson:
    # JSON 时间统一使用中国时区和固定格式，避免前后端相差 8 小时。
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Spring 在进入 Controller 前拒绝超过限制的 multipart 请求，和 FileStorageService 双重保护。
      max-file-size: 5MB
      max-request-size: 5MB
  ai:
    openai:
      base-url: ${AI_REVIEW_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${AI_REVIEW_MODEL:deepseek-v4-flash}
          response-format:
            type: json_object

server:
  # 使用环境变量可让不同机器选择端口，未配置时默认 8080。
  port: ${CT_SERVER_PORT:8080}
  servlet:
    # Controller 内不重复写 /api，统一由上下文路径添加。
    context-path: /api

mybatis:
  # ** 表示递归扫描 mapper 下所有业务子目录中的 XML。
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    # 数据库 snake_case 字段自动映射为 Java camelCase 属性。
    map-underscore-to-camel-case: true
    # 未知列只记录警告，便于开发期尽早发现 SQL 与实体不一致。
    auto-mapping-unknown-column-behavior: warning

management:
  # Actuator 目前只开放健康检查和基础信息，不暴露敏感环境配置。
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

ai:
  review:
    enabled: ${AI_REVIEW_ENABLED:false}
    model: ${AI_REVIEW_MODEL:deepseek-v4-flash}
    base-url: ${AI_REVIEW_BASE_URL:https://api.deepseek.com}
    request-timeout: ${AI_REVIEW_REQUEST_TIMEOUT:35s}
    stale-after: ${AI_REVIEW_STALE_AFTER:10m}
    retry-backoff: ${AI_REVIEW_RETRY_BACKOFF:1s}
    max-retries: ${AI_REVIEW_MAX_RETRIES:1}
    scan-delay-ms: ${AI_REVIEW_SCAN_DELAY_MS:60000}
    rule-domain: ${AI_REVIEW_RULE_DOMAIN:PRODUCT_RULE}
