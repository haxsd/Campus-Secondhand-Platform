services:
  mysql:
    image: mysql:8
    container_name: campus-trade-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_trade}
    command: --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - campus-trade-mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/initial-data.sql:/docker-entrypoint-initdb.d/02-initial-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    container_name: campus-trade-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - campus-trade-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: campus-trade-namesrv
    profiles: ["rocketmq"]
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    volumes:
      - campus-trade-namesrv-logs:/home/rocketmq/logs

  rocketmq-permissions:
    image: apache/rocketmq:5.3.2
    container_name: campus-trade-rocketmq-permissions
    profiles: ["rocketmq"]
    user: "0:0"
    depends_on:
      namesrv:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        mkdir -p /home/rocketmq/store /home/rocketmq/broker-logs
        /home/rocketmq/proxy-logs /home/rocketmq/namesrv-logs &&
        chown -R 3000:3000 /home/rocketmq/store /home/rocketmq/broker-logs
        /home/rocketmq/proxy-logs /home/rocketmq/namesrv-logs
    volumes:
      - campus-trade-broker-store:/home/rocketmq/store
      - campus-trade-broker-logs:/home/rocketmq/broker-logs
      - campus-trade-proxy-logs:/home/rocketmq/proxy-logs
      - campus-trade-namesrv-logs:/home/rocketmq/namesrv-logs

  broker:
    image: apache/rocketmq:5.3.2
    container_name: campus-trade-broker
    profiles: ["rocketmq"]
    restart: unless-stopped
    depends_on:
      rocketmq-permissions:
        condition: service_completed_successfully
    command: ["sh", "-c", "sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf; tail -f /dev/null"]
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_HA_PORT:-10912}:10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - campus-trade-broker-store:/home/rocketmq/store
      - campus-trade-broker-logs:/home/rocketmq/logs

  topic-init:
    image: apache/rocketmq:5.3.2
    container_name: campus-trade-topic-init
    profiles: ["rocketmq"]
    restart: "no"
    depends_on:
      broker:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        until sh mqadmin clusterList -n namesrv:9876 | grep -q broker-a;
        do sleep 2; done;
        if sh mqadmin topicList -n namesrv:9876 | grep -qx
        campus_trade_order_timeout; then exit 0; fi;
        sh mqadmin updateTopic -n namesrv:9876
        -t campus_trade_order_timeout -c DefaultCluster
        -a '+message.type=DELAY'

  proxy:
    image: apache/rocketmq:5.3.2
    container_name: campus-trade-proxy
    profiles: ["rocketmq"]
    restart: unless-stopped
    depends_on:
      namesrv:
        condition: service_started
      broker:
        condition: service_started
      topic-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "sh mqproxy -n namesrv:9876; tail -f /dev/null"]
    ports:
      - "${ROCKETMQ_PROXY_PORT:-8081}:8081"
    volumes:
      - campus-trade-proxy-logs:/home/rocketmq/logs

  nginx:
    image: nginx:1.27-alpine
    container_name: campus-trade-nginx
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      topic-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/campus-trade.conf:/etc/nginx/nginx.conf:ro

volumes:
  campus-trade-mysql-data:
  campus-trade-redis-data:
  campus-trade-namesrv-logs:
  campus-trade-broker-store:
  campus-trade-broker-logs:
  campus-trade-proxy-logs:
